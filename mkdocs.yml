site_name: CRIM Intervals
site_description: API documentation for the crim_intervals package
site_url: https://hcdigitalscholarship.github.io/intervals/
repo_url: https://github.com/HCDigitalScholarship/intervals
docs_dir: docs

watch:
  - crim_intervals

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - API Reference:
      - main_objs.py: api/main_objs.md
      - main.py: api/main.md
      - sorting_lists.py: api/sorting_lists.md
      - networks.py: api/networks.md
      - visualizations.py: api/visualizations.md
      - corpus_tools.py (deprecated): api/corpus_tools.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          load_external_modules: false
          options:
            allow_inspection: true
            force_inspection: true
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            docstring_section_style: table
            members_order: alphabetical
            separate_signature: true
            show_signature_annotations: true
            filters:
              - "!^_"
