name: interval-test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let every Python version finish and report its own result,
                         # instead of one failing leg cancelling the others mid-run
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4          # MUST be first

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package itself, so the tests run against the same dependency
      # versions a user gets from `pip install crim_intervals` (the ranges in
      # pyproject.toml), rather than the frozen pins in requirements.txt.
      # pip picks the newest versions each Python allows, so 3.10 tests
      # pandas 2 and 3.11+ test pandas 3.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install .

      - name: Show key versions
        run: |
          python -c "import sys, pandas, numpy, music21; print('python', sys.version.split()[0], '| pandas', pandas.__version__, '| numpy', numpy.__version__, '| music21', music21.__version__)"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          pytest crim_intervals/ -v


  publish:
    runs-on: ubuntu-latest
    needs: build                          # only runs if ALL matrix jobs pass
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry and bump version
        run: |
          pip install poetry
          poetry self add poetry-bumpversion
          poetry version patch

      - name: Publish to PyPI
        run: |
          poetry config pypi-token.pypi "${{ secrets.PYPI_TOKEN }}"
          rm -rf dist/
          poetry publish --build --no-interaction

      - name: Commit bumped version and updated README
        run: |
          VERSION=$(poetry version -s)
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "Update README.md with new version $VERSION [skip ci]"
          git push


  docs:
    runs-on: ubuntu-latest
    needs: build                          # only runs if ALL matrix jobs pass
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs==1.6.1 mkdocs-material==9.7.7 mkdocstrings==1.0.6 mkdocstrings-python==2.0.5 "pymdown-extensions<12"

      - name: Deploy docs to GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdocs gh-deploy --force